<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="brand-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <!-- background: matches .mark (h-8 w-8 rounded -> ~12.5% radius) -->
  <rect x="0" y="0" width="512" height="512" rx="64" fill="url(#brand-gradient)" />

  <!-- glyph: matches .glyph (h-4 w-4 of h-8 w-8 -> 50% size, rounded-sm -> ~12.5% radius) -->
  <rect
    x="128" y="128"
    width="256" height="256"
    rx="32"
    fill="#000000"
    transform="rotate(45 256 256)"
  />
</svg>
